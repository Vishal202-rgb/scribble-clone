<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" fill="none">
  <!-- Soft, low-contrast doodle pattern for Skribbl Clone -->
  <g stroke="#B3D1F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    
    <!-- 1. Pencil (top-left) -->
    <g transform="translate(25, 30) rotate(-35)">
      <polygon points="0,0 28,0 35,8 28,16 0,16" />
      <polygon points="28,0 35,8 28,16" fill="#B3D1F2" fill-opacity="0.2" />
      <line x1="-8" y1="8" x2="0" y2="0" />
      <line x1="-8" y1="8" x2="0" y2="16" />
      <polygon points="-8,8 -3,4 -3,12" fill="#B3D1F2" />
      <line x1="6" y1="0" x2="6" y2="16" />
    </g>

    <!-- 2. Five-Point Star (top) -->
    <polygon points="110,25 113,33 121,33 115,38 117,46 110,41 103,46 105,38 99,33 107,33" />

    <!-- 3. Paintbrush (top-center) -->
    <g transform="translate(170, 30) rotate(40)">
      <path d="M 0,0 L 26,0 C 30,0 34,4 34,8 C 34,12 30,16 26,16 L 0,16 Z" />
      <path d="M -16,4 C -10,4 -6,6 -6,8 C -6,10 -10,12 -16,12 C -22,12 -26,8 -26,8 C -26,8 -22,4 -16,4 Z" fill="#B3D1F2" fill-opacity="0.2" />
      <line x1="10" y1="0" x2="10" y2="16" />
    </g>

    <!-- 4. Light Bulb with rays (top-right) -->
    <g transform="translate(260, 30)">
      <circle cx="15" cy="15" r="10" />
      <path d="M 10,24 L 20,24 M 11,27 L 19,27 M 13,30 L 17,30" />
      <!-- Glow rays -->
      <line x1="15" y1="0" x2="15" y2="-4" />
      <line x1="28" y1="5" x2="31" y2="2" />
      <line x1="2" y1="5" x2="-1" y2="2" />
    </g>

    <!-- 5. Cute Heart (far top-right) -->
    <path d="M 330,25 C 330,20 324,16 319,20 C 314,16 308,20 308,25 C 308,32 319,39 319,39 C 319,39 330,32 330,25 Z" />

    <!-- 6. Cute Car (upper-left) -->
    <g transform="translate(30, 105)">
      <path d="M 0,20 L 6,20 L 12,10 L 28,10 L 36,20 L 46,20 C 49,20 50,23 50,26 L 0,26 Z" />
      <!-- Wheels -->
      <circle cx="12" cy="27" r="5" />
      <circle cx="36" cy="27" r="5" />
      <!-- Window divider -->
      <line x1="22" y1="11" x2="22" y2="20" />
    </g>

    <!-- 7. Diamond / Rhombus (upper-center) -->
    <polygon points="135,95 147,110 135,125 123,110" />

    <!-- 8. Paint Palette with thumbhole & colors (mid-right) -->
    <g transform="translate(245, 115)">
      <path d="M 10,30 C 5,15 20,0 40,5 C 60,10 65,30 50,42 C 42,48 38,42 32,45 C 26,48 25,55 18,52 C 8,48 15,38 10,30 Z" />
      <circle cx="28" cy="42" r="3" />
      <circle cx="30" cy="18" r="2.5" fill="#B3D1F2" />
      <circle cx="45" cy="22" r="2.5" fill="#B3D1F2" />
      <circle cx="48" cy="34" r="2.5" fill="#B3D1F2" />
    </g>

    <!-- 9. Triangle doodle (far right) -->
    <polygon points="330,95 345,125 315,125" />

    <!-- 10. Cute Swirl / Spiral (center) -->
    <path d="M 195,120 Q 205,120 205,128 Q 205,136 195,136 Q 183,136 183,124 Q 183,110 197,110 Q 215,110 215,128" />

    <!-- 11. Target / Concentric circles (mid-left) -->
    <circle cx="40" cy="190" r="14" />
    <circle cx="40" cy="190" r="7" />
    <circle cx="40" cy="190" r="1.5" fill="#B3D1F2" />

    <!-- 12. Smiley Face (lower-left) -->
    <g transform="translate(90, 175)">
      <circle cx="16" cy="16" r="15" />
      <circle cx="11" cy="12" r="1.5" fill="#B3D1F2" />
      <circle cx="21" cy="12" r="1.5" fill="#B3D1F2" />
      <path d="M 10,19 Q 16,26 22,19" />
    </g>

    <!-- 13. House with chimney & door (center-bottom) -->
    <g transform="translate(165, 180)">
      <!-- Roof -->
      <polygon points="20,0 0,16 40,16" />
      <!-- Chimney -->
      <rect x="28" y="4" width="5" height="8" />
      <!-- Body -->
      <rect x="4" y="16" width="32" height="24" />
      <!-- Door -->
      <rect x="15" y="26" width="10" height="14" />
      <!-- Window -->
      <rect x="8" y="20" width="6" height="6" />
    </g>

    <!-- 14. 3D Cube (lower-right) -->
    <g transform="translate(285, 205)">
      <polygon points="18,0 36,9 18,18 0,9" />
      <polygon points="0,9 18,18 18,36 0,27" />
      <polygon points="18,18 36,9 36,27 18,36" fill="#B3D1F2" fill-opacity="0.15" />
    </g>

    <!-- 15. Sparkle Stars (left & right) -->
    <path d="M 35,260 Q 35,270 45,270 Q 35,270 35,280 Q 35,270 25,270 Q 35,270 35,260 Z" fill="#B3D1F2" fill-opacity="0.25" />
    <path d="M 335,175 Q 335,183 343,183 Q 335,183 335,191 Q 335,183 327,183 Q 335,183 335,175 Z" fill="#B3D1F2" fill-opacity="0.25" />

    <!-- 16. Paper Airplane (bottom-left) -->
    <g transform="translate(95, 275) rotate(-15)">
      <polygon points="0,15 35,0 15,30 18,18" />
      <line x1="35" y1="0" x2="18" y2="18" />
    </g>

    <!-- 17. Coffee / Cocoa Mug with steam (bottom-center) -->
    <g transform="translate(195, 275)">
      <rect x="0" y="8" width="22" height="20" rx="3" />
      <path d="M 22,12 C 28,12 28,22 22,22" />
      <!-- Steam -->
      <path d="M 5,3 Q 8,0 5,-3" />
      <path d="M 12,3 Q 15,0 12,-3" />
      <path d="M 18,3 Q 21,0 18,-3" />
    </g>

    <!-- 18. Eighth Note / Music (bottom-right) -->
    <g transform="translate(280, 280)">
      <circle cx="6" cy="18" r="4" fill="#B3D1F2" fill-opacity="0.3" />
      <line x1="10" y1="18" x2="10" y2="4" />
      <path d="M 10,4 Q 16,3 18,10" />
    </g>

    <!-- 19. Zig-Zag / Lightning (far bottom-left) -->
    <polyline points="20,335 30,325 25,325 35,310" />

    <!-- 20. Crown / Doodle Hat (bottom) -->
    <g transform="translate(145, 330)">
      <polygon points="0,15 5,5 15,10 25,5 30,15" />
      <line x1="0" y1="15" x2="30" y2="15" />
    </g>

    <!-- 21. Cloud / Speech Bubble (bottom-right) -->
    <path d="M 320,320 C 314,320 310,314 314,308 C 314,302 322,298 328,302 C 334,296 344,300 344,306 C 350,308 350,316 344,320 Z" />

  </g>
</svg>
